# PREVENTATIVE CONTROL (cluster level): a hardened "prod" namespace that refuses the kind of
# weak pod spec this exercise ships in the demo namespace.
# Pod Security Admission "restricted" rejects privileged containers, host mounts, running as root,
# and missing seccomp. Demonstration:
#   kubectl apply -f security/prod-namespace.yaml
#   kubectl -n prod apply -f <any privileged/host-mounting pod>   -> admission denies it
apiVersion: v1
kind: Namespace
metadata:
  name: prod
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
---
# Deployers into prod get a namespace-scoped Role only. No one receives cluster-admin by default here,
# which is the direct contrast with the intentionally weak binding in k8s/rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: deployer, namespace: prod }
rules:
  - apiGroups: ["apps", ""]
    resources: ["deployments", "services", "configmaps", "pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
# Default-deny networking for prod (Dataplane V2 enforces NetworkPolicy natively).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: prod }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
