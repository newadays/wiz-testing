apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasky
  namespace: tasky
  labels: { app: tasky }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: tasky }
  template:
    metadata:
      labels: { app: tasky }
    spec:
      serviceAccountName: tasky
      # automountServiceAccountToken is left at the default (true) on purpose: with cluster-admin bound,
      # the mounted token is what makes the weakness exploitable from inside the container.
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: tasky
          image: us-central1-docker.pkg.dev/PROJECT_ID/apps/tasky:latest   # replaced by the app pipeline with a digest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            # Requirement: Mongo access configured via an environment variable in Kubernetes.
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-uri
                  key: uri
            - name: APP_VERSION
              value: "1.0.0"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            httpGet: { path: /healthz/ready, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz/live, port: http }
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          # Read-only root filesystem: gunicorn's worker heartbeat files need a writable /tmp.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
