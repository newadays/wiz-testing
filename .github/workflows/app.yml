# Pipeline 2: build the container, scan it, push it by digest, prove wizexercise.txt is inside, deploy to GKE.
name: app
on:
  pull_request:
    paths: ["app/**", "k8s/**", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["app/**", "k8s/**", ".github/workflows/app.yml"]

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT }}
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/apps/tasky

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: app/requirements-dev.txt }
      - run: pip install -r app/requirements-dev.txt && cd app && python -m pytest -q
      - name: Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: app/Dockerfile }

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: app
          load: true
          tags: tasky:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prove wizexercise.txt is inside the image
        run: |
          docker run --rm tasky:ci cat /app/wizexercise.txt | tee wizexercise.out
          grep -q "Gbenga" wizexercise.out
      - name: Trivy image scan (fail on CRITICAL/HIGH with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tasky:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true # without it, SARIF output scans every severity and exit-code fails on LOW/MEDIUM
          ignore-unfixed: true
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy.sarif }
      - name: SBOM
        uses: anchore/sbom-action@v0
        with: { image: tasky:ci, format: spdx-json, output-file: sbom.spdx.json }
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.spdx.json }
      - uses: google-github-actions/auth@v2
        if: github.event_name == 'push'
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_APP_SA }}
      - run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet
        if: github.event_name == 'push'
      - name: Push
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
      - name: Sign the image (keyless, Sigstore)
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3
      - if: github.event_name == 'push'
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_APP_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        with: { install_components: "gke-gcloud-auth-plugin,kubectl" }
      - name: Connect to the private cluster through the Connect gateway
        run: gcloud container fleet memberships get-credentials wiz-gke --project $GCP_PROJECT
      - name: Mongo URI from Secret Manager into a Kubernetes Secret (never in the repo)
        run: |
          kubectl apply -f k8s/namespace.yaml
          gcloud secrets versions access latest --secret mongodb-uri --project $GCP_PROJECT > uri.txt
          kubectl -n tasky create secret generic mongodb-uri --from-file=uri=uri.txt --dry-run=client -o yaml | kubectl apply -f -
          rm -f uri.txt
      - name: Deploy by digest
        run: |
          cd k8s
          sed -i "s#PROJECT_ID#$GCP_PROJECT#g" kustomization.yaml deployment.yaml
          kubectl kustomize . | sed "s#${IMAGE}:latest#${IMAGE}@${{ needs.build.outputs.digest }}#" | kubectl apply -f -
          kubectl -n tasky rollout status deployment/tasky --timeout=180s
      # The Connect gateway refuses kubectl exec (streaming upgrade, HTTP 400), so prove it by digest instead:
      # the build job showed wizexercise.txt is in this exact image, and every running pod must be that image.
      # To read the file live, exec from the laptop over the direct endpoint (cmd.md step 11).
      - name: Verify the RUNNING pods are the image that contains wizexercise.txt
        run: |
          WANT="${{ needs.build.outputs.digest }}"
          echo "expected digest: $WANT"
          # Compare the image each pod was told to run (a digest, so it can't drift). Not status.imageID: when a new push is
          # byte-identical to an old one, the node reports whichever digest it cached first.
          # Old pods can still be shutting down right after the rollout; give them up to 2 minutes to go.
          for i in $(seq 1 12); do
            kubectl -n tasky get pods -l app=tasky -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.containers[0].image}{"\n"}{end}' > pods.txt
            [ -s pods.txt ] && ! grep -q -v -- "$WANT" pods.txt && break
            sleep 10
          done
          cat pods.txt
          [ -s pods.txt ] || { echo "no tasky pods found"; exit 1; }
          if grep -v -- "$WANT" pods.txt; then echo "pods above are NOT running the scanned image"; exit 1; fi
          echo "all running pods use $WANT, which contains wizexercise.txt"
      - name: Smoke test through the load balancer
        run: |
          for i in $(seq 1 30); do
            IP=$(kubectl -n tasky get ingress tasky -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            [ -n "$IP" ] && curl -fsS --max-time 10 "http://$IP/healthz/ready" && echo && echo "http://$IP" && exit 0
            sleep 20
          done
          echo "ingress not ready yet; check kubectl -n tasky describe ingress tasky"; exit 1
